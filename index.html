*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-main);font-size:14.5px;line-height:1.55;transition:background .5s,color .5s;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body:not(.dark)::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(circle at 12% 8%,var(--pattern1) 0,transparent 32%),radial-gradient(circle at 92% 18%,var(--pattern2) 0,transparent 30%),radial-gradient(circle at 70% 95%,var(--pattern3) 0,transparent 30%),var(--pattern-base);background-attachment:fixed}
body.dark::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(circle at 12% 8%,var(--pattern1) 0,transparent 32%),radial-gradient(circle at 92% 18%,var(--pattern2) 0,transparent 30%),radial-gradient(circle at 70% 95%,var(--pattern3) 0,transparent 30%),var(--pattern-base);background-attachment:fixed}
.hearts,.stars{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.hearts i,.stars i{position:absolute;bottom:-40px;opacity:.35;animation:floatUp linear infinite}
.stars i{top:-40px;bottom:auto;animation:twinkle-fall linear infinite}
@keyframes floatUp{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.45}90%{opacity:.3}100%{transform:translateY(-115vh) rotate(720deg);opacity:0}}
@keyframes twinkle-fall{0%{transform:translateY(0) scale(.6);opacity:0}10%{opacity:.7}90%{opacity:.5}100%{transform:translateY(115vh) scale(1.1);opacity:0}}
h1,h2,.brand,.hero h2,.secret,.guide-num{font-family:var(--font-head);letter-spacing:-.4px}
.caveat,.dedic,.footer,.toast{font-family:var(--font-hand)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:14px;padding:11px 16px;background:color-mix(in srgb,var(--accent) 25%,var(--card));color:var(--ink);font-weight:600;transition:transform .18s cubic-bezier(.2,.9,.3,1.6),filter .15s,box-shadow .25s}
button:hover{filter:brightness(1.05);transform:translateY(-2px);box-shadow:0 8px 22px #6b46a033}
button:active{transform:scale(.95)}
button:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
button.primary{background:linear-gradient(120deg,var(--accent),var(--purple));color:#fff;font-weight:700;box-shadow:0 6px 20px color-mix(in srgb,var(--accent) 40%,transparent)}
button.gold{background:linear-gradient(120deg,#f4c06f,#e8a3c6);color:#5a3c10;font-weight:700}
button.ghost{background:transparent;color:var(--muted)}
button.danger{background:#ffe0e0;color:#a23a3a}
:root.dark button.danger{background:#4a2030;color:#ffb3b3}
button.small{padding:7px 12px;font-size:12px;border-radius:10px}
aside{position:fixed;width:230px;height:100vh;padding:22px 16px;background:var(--sidebar-bg);backdrop-filter:blur(16px);border-right:1px solid var(--line);z-index:10;display:flex;flex-direction:column;overflow-y:auto}
.brand{font-size:28px;font-weight:700;letter-spacing:-1px;background:linear-gradient(120deg,var(--purple),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .heart{display:inline-block;color:var(--accent);-webkit-text-fill-color:var(--accent);animation:heartbeat 1.6s ease-in-out infinite}
@keyframes heartbeat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.18)}60%{transform:scale(1)}}
.dedic{display:inline-block;margin:10px 0 4px;padding:7px 13px;border-radius:20px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 30%,#fff),color-mix(in srgb,var(--purple) 25%,#fff));color:color-mix(in srgb,var(--purple) 70%,#333);font-size:15px;font-weight:700;animation:pulseSoft 4s ease-in-out infinite}
:root.dark .dedic{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 30%,#222),color-mix(in srgb,var(--purple) 30%,#222));color:color-mix(in srgb,var(--accent) 80%,#fff)}
@keyframes pulseSoft{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.sub{color:var(--muted);font-size:11px;margin:4px 0 18px;letter-spacing:.3px}
nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;margin:4px 0;padding:11px 13px;border-radius:14px;font-size:13.5px;font-weight:600;transition:.3s cubic-bezier(.2,.9,.3,1.6)}
nav button .nav-icon{font-size:18px;width:24px;text-align:center}
nav button:hover{transform:translateX(5px);background:color-mix(in srgb,var(--accent) 15%,transparent)}
nav button.active{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 25%,var(--card)),color-mix(in srgb,var(--purple) 20%,var(--card)));color:var(--ink);box-shadow:0 5px 16px color-mix(in srgb,var(--purple) 25%,transparent)}
nav button .badge{margin-left:auto;background:var(--accent);color:#fff;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:800}
nav hr{border:0;border-top:1px solid var(--line);margin:10px 4px}
.sidecard{margin-top:18px;padding:16px;border-radius:18px;background:var(--grad-side);font-size:12px;color:color-mix(in srgb,var(--purple) 60%,var(--ink));line-height:1.55;position:relative;overflow:hidden}
.sidecard::after{content:'💜';position:absolute;right:-10px;bottom:-16px;font-size:64px;opacity:.15;animation:wiggle 6s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
.sidecard b{display:block;font-family:var(--font-head);font-size:16px;margin-bottom:5px;font-weight:700;color:var(--ink)}
main{margin-left:230px;padding:32px;max-width:1550px;position:relative;z-index:2;animation:fadeIn .45s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px;flex-wrap:wrap}
h1{font-size:36px;margin:0;letter-spacing:-1px;font-weight:700}
h2{font-size:21px;margin:0 0 16px;font-weight:700;letter-spacing:-.3px}
h3{font-size:16px;margin:0 0 10px;font-weight:700}
p{line-height:1.65}
.muted{color:var(--muted);font-size:12.5px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card,.panel{padding:22px;border-radius:24px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);transition:transform .35s cubic-bezier(.2,.9,.3,1.4),box-shadow .3s;position:relative;overflow:hidden}
.card:hover,.panel:hover{transform:translateY(-5px) scale(1.006);box-shadow:0 18px 46px color-mix(in srgb,var(--purple) 15%,transparent)}
.card b{display:block;font-size:32px;margin:9px 0;font-family:var(--font-head);font-weight:700}
.lavender{background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 25%,var(--card)),color-mix(in srgb,var(--accent) 40%,var(--card)))}
.peach{background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 20%,var(--card)),color-mix(in srgb,var(--accent) 35%,var(--card)))}
.mint{background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 22%,var(--card)),color-mix(in srgb,var(--accent) 38%,var(--card)))}
.blue{background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 18%,var(--card)),color-mix(in srgb,var(--accent) 32%,var(--card)))}
.rose{background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 28%,var(--card)),color-mix(in srgb,var(--accent) 42%,var(--card)))}
.gold{background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 22%,var(--card)),color-mix(in srgb,var(--accent) 45%,var(--card)))}
.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;margin-top:22px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.panel{margin-bottom:20px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row input,.row select{flex:1;min-width:100px}
input,select,textarea{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 13px;max-width:100%;color:var(--ink);transition:border-color .25s,box-shadow .25s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 4px color-mix(in srgb,var(--purple) 20%,transparent)}
input[type=checkbox]{accent-color:var(--purple);width:18px;height:18px;flex:none;min-width:0;cursor:pointer}
input[type=number]{width:110px}
label{font-size:12.5px;color:var(--muted);font-weight:600}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);animation:slideIn .35s ease backwards}
@keyframes slideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.item span{flex:1}
.done{text-decoration:line-through;color:var(--muted);opacity:.7}
.delete{padding:6px 10px;background:transparent;color:var(--muted);font-size:16px;border-radius:10px}
.delete:hover{background:#ffe0e0;color:#a23a3a;transform:scale(1.15) rotate(8deg)}
.bar{height:10px;border-radius:10px;background:color-mix(in srgb,var(--card) 70%,#aaa);overflow:hidden;margin-top:13px;box-shadow:inset 0 1px 3px #0001}
.bar i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,var(--accent),var(--purple));transition:width 1.2s cubic-bezier(.2,.9,.3,1)}
.tablewrap{overflow:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:12px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:700;position:sticky;top:0;background:var(--card);z-index:1;font-family:var(--font-head);font-size:14px}
.tablewrap th:first-child,.tablewrap td:first-child{position:sticky;left:0;background:var(--card);z-index:2}
.chart{display:flex;align-items:flex-end;height:150px;gap:10px;padding-top:20px}
.column{flex:1;text-align:center;min-width:0;cursor:pointer}
.column i{display:block;border-radius:8px 8px 0 0;min-height:3px;background:linear-gradient(var(--accent),var(--purple));animation:grow .9s cubic-bezier(.2,.9,.3,1.4) backwards;transition:height .5s,filter .2s}
.column:hover i{filter:brightness(1.15)}
@keyframes grow{from{height:0!important}}
.column small{display:block;font-size:10px;margin-top:8px;color:var(--muted)}
/* Круговая диаграмма */
.donut{width:180px;height:180px;border-radius:50%;position:relative;flex:none;display:grid;place-items:center;margin:0 auto}
.donut::after{content:'';position:absolute;inset:24%;border-radius:50%;background:var(--card)}
.donut .donut-center{position:relative;z-index:1;text-align:center;font-family:var(--font-head)}
.donut .donut-center b{display:block;font-size:24px;font-weight:700}
.donut .donut-center small{font-size:11px;color:var(--muted)}
.legend-list{display:grid;gap:8px;font-size:13px}
.legend-list .row-item{display:flex;align-items:center;gap:8px}
.legend-list .row-item .dot{width:12px;height:12px;border-radius:50%;flex:none}
.legend-list .row-item .lbl{flex:1}
.legend-list .row-item .val{font-weight:700;font-family:var(--font-head)}
.empty{padding:24px;text-align:center;background:color-mix(in srgb,var(--accent) 8%,var(--card));border-radius:16px;color:var(--muted);border:1.5px dashed var(--line);font-size:13px}
.pill{display:inline-block;border-radius:20px;padding:5px 11px;background:color-mix(in srgb,var(--accent) 20%,var(--card));font-size:12px;font-weight:600}
.pill.ok{background:color-mix(in srgb,var(--success) 25%,var(--card));color:var(--success)}
.pill.warn{background:color-mix(in srgb,var(--danger) 25%,var(--card));color:var(--danger)}
.footer{margin-top:30px;color:var(--muted);text-align:center;line-height:1.8;font-size:16px}
.hidden{display:none!important}
.formgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.formgrid label input{display:block;width:100%;margin-top:8px}
a{color:var(--purple);text-decoration:none;border-bottom:1px dashed currentColor}
.hero{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:30px 34px;margin-bottom:22px;border-radius:32px;background:var(--grad-hero);box-shadow:0 18px 46px color-mix(in srgb,var(--purple) 20%,transparent);position:relative;overflow:hidden;animation:heroIn .8s cubic-bezier(.2,.9,.3,1.2)}
@keyframes heroIn{from{opacity:0;transform:translateY(-16px) scale(.98)}}
.hero::before{content:'';position:absolute;inset:-60%;background:conic-gradient(from 0deg,transparent,#ffffff55,transparent 30%);animation:shimmer 10s linear infinite;pointer-events:none}
@keyframes shimmer{to{transform:rotate(360deg)}}
.hero::after{content:'✦ ✧ ♡ ✧ ✦';position:absolute;right:150px;top:14px;font-size:20px;letter-spacing:14px;color:#ffffffcc;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.55}}
.hero h2{font-size:34px;margin:6px 0;color:var(--ink);font-weight:700;font-style:italic}
.hero p{margin:0;color:color-mix(in srgb,var(--ink) 70%,var(--purple));font-size:14px}
.hero .for{display:inline-block;padding:7px 15px;border-radius:22px;background:color-mix(in srgb,var(--card) 85%,transparent);color:var(--purple);font-weight:700;font-family:var(--font-hand);font-size:16px}
.hero .chips{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.hero .chips span{background:color-mix(in srgb,var(--card) 85%,transparent);border-radius:22px;padding:7px 14px;font-size:12px;color:var(--ink);font-weight:600;transition:transform .3s cubic-bezier(.2,.9,.3,1.6)}
.hero .chips span:hover{transform:translateY(-3px) scale(1.06)}
.ring{width:120px;height:120px;border-radius:50%;background:conic-gradient(from -90deg,var(--purple) calc(var(--p)*1%),color-mix(in srgb,var(--card) 60%,transparent) 0);display:grid;place-items:center;flex:none;position:relative;transition:background 1.2s;animation:ringPop .7s cubic-bezier(.2,.9,.3,1.6)}
@keyframes ringPop{from{transform:scale(0) rotate(-180deg)}}
.ring span{width:92px;height:92px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800;font-size:22px;color:var(--purple);text-align:center;line-height:1;font-family:var(--font-head)}
.ring small{display:block;font-size:10px;font-weight:700;color:var(--muted);margin-top:4px;font-family:var(--font-main)}
.glasses{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.glass{padding:8px 10px;border-radius:12px;background:color-mix(in srgb,var(--accent) 15%,var(--card));opacity:.4;filter:grayscale(1);font-size:18px;min-width:40px;transition:all .4s cubic-bezier(.2,.9,.3,1.6)}
.glass:hover{transform:scale(1.2) rotate(-8deg)}
.glass.full{opacity:1;filter:none;background:color-mix(in srgb,var(--accent) 35%,var(--card));animation:pop .5s cubic-bezier(.2,.9,.3,1.6)}
@keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.macro{display:flex;height:18px;border-radius:12px;overflow:hidden;background:var(--line);margin:12px 0 10px}
.macro i{display:block;height:100%;transition:width 1s cubic-bezier(.2,.9,.3,1)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend b{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;margin-right:6px}
.tag-work{background:#e6f0fa;color:#2a5a8a}
.tag-home{background:#ffe9dc;color:#a85a2a}
.tag-health{background:#e5f1e6;color:#2a7a4a}
.tag-study{background:#eee7fa;color:#5a3a8a}
.tag-other{background:#f0ebf1;color:#6a5a6a}
.tag-money{background:#fff3d6;color:#8a6a10}
:root.dark .tag-work{background:#28344a;color:#a8c8e8}
:root.dark .tag-home{background:#4a3428;color:#f0c8a8}
:root.dark .tag-health{background:#2a4030;color:#a8d8b8}
:root.dark .tag-study{background:#33284a;color:#d0b8f0}
:root.dark .tag-other{background:#3a3030;color:#d0c0c0}
:root.dark .tag-money{background:#4a3f24;color:#f0d8a0}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-width:300px}
.heat i{aspect-ratio:1;border-radius:7px;background:var(--line);transition:transform .25s;cursor:pointer}
.heat i:hover{transform:scale(1.25)}
.heat i.l1{background:color-mix(in srgb,var(--accent) 40%,var(--line))}
.heat i.l2{background:color-mix(in srgb,var(--accent) 65%,var(--line))}
.heat i.l3{background:color-mix(in srgb,var(--accent) 85%,var(--line))}
.heat i.l4{background:var(--purple)}
/* Табы внутри страниц */
.tabs{display:flex;gap:6px;padding:5px;background:var(--card);border-radius:16px;margin-bottom:20px;border:1px solid var(--line);flex-wrap:wrap}
.tab{flex:1;min-width:110px;padding:11px 14px;border-radius:12px;background:transparent;font-weight:700;font-size:13px;color:var(--muted);transition:all .3s cubic-bezier(.2,.9,.3,1.6);text-align:center}
.tab.active{background:linear-gradient(135deg,var(--accent),var(--purple));color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 40%,transparent)}
.theme-btn{position:fixed;top:16px;right:16px;z-index:100;width:48px;height:48px;border-radius:50%;padding:0;font-size:20px;background:var(--card);box-shadow:0 6px 20px #0003;display:grid;place-items:center;transition:transform .35s cubic-bezier(.2,.9,.3,1.6)}
.theme-btn:hover{transform:rotate(25deg) scale(1.12)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--ink);color:var(--bg);padding:13px 24px;border-radius:16px;box-shadow:0 12px 36px #0005;z-index:200;transition:transform .45s cubic-bezier(.2,.9,.3,1.6);font-weight:700;font-size:17px;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden}
.confetti i{position:absolute;width:10px;height:14px;top:-20px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
.modal{position:fixed;inset:0;background:#00000088;z-index:150;display:grid;place-items:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .35s}
.modal.show{opacity:1;pointer-events:auto}
.modal-box{background:var(--card);border-radius:28px;padding:30px;max-width:640px;width:100%;transform:scale(.9);transition:transform .4s cubic-bezier(.2,.9,.3,1.6);max-height:88vh;overflow:auto;border:2px solid var(--line)}
.modal.show .modal-box{transform:scale(1)}
.modal-title{font-family:var(--font-head);font-size:24px;font-weight:700;margin:0 0 16px}
.auth-screen{position:fixed;inset:0;z-index:500;background:radial-gradient(circle at 30% 30%,var(--pattern1) 0,transparent 50%),radial-gradient(circle at 70% 70%,var(--pattern2) 0,transparent 50%),var(--pattern-base);display:grid;place-items:center;padding:20px;overflow-y:auto}
.auth-box{text-align:center;max-width:520px;width:100%;padding:36px;border-radius:32px;background:var(--glass);backdrop-filter:blur(20px);border:1.5px solid var(--line);box-shadow:0 30px 80px color-mix(in srgb,var(--purple) 25%,transparent);animation:welcomeIn .9s cubic-bezier(.2,.9,.3,1.4)}
@keyframes welcomeIn{from{opacity:0;transform:scale(.9) translateY(20px)}}
.auth-box h1{font-size:44px;margin:0;line-height:1;background:linear-gradient(120deg,var(--purple),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.auth-box .sub-wel{font-family:var(--font-hand);font-size:24px;color:var(--purple);margin:8px 0 22px}
.auth-tabs{display:flex;gap:6px;padding:5px;background:var(--card);border-radius:16px;margin-bottom:20px;border:1px solid var(--line)}
.auth-tab{flex:1;padding:11px;border-radius:12px;background:transparent;font-weight:700;font-size:13px;color:var(--muted);transition:all .3s cubic-bezier(.2,.9,.3,1.6)}
.auth-tab.active{background:linear-gradient(135deg,var(--accent),var(--purple));color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 40%,transparent)}
.auth-form{display:grid;gap:12px;text-align:left}
.auth-form label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px}
.auth-form input,.auth-form select{width:100%;padding:13px 15px;font-size:15px;border-radius:14px}
.auth-form button{width:100%;padding:14px;font-size:15px;margin-top:6px}
.auth-msg{padding:11px 14px;border-radius:12px;font-size:13px;text-align:center;margin-top:4px}
.auth-msg.error{background:#ffe0e0;color:#a23a3a}
.auth-msg.ok{background:#e5f1e6;color:#2a7a4a}
.auth-hint{margin-top:14px;padding:12px 16px;border-radius:14px;background:color-mix(in srgb,var(--accent) 15%,var(--card));font-size:12px;color:color-mix(in srgb,var(--purple) 80%,var(--ink));text-align:left;line-height:1.5}
.user-profile{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--glass);border:1px solid var(--line);margin-bottom:14px;cursor:pointer;transition:transform .25s}
.user-profile:hover{transform:scale(1.02)}
.user-profile .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:linear-gradient(135deg,var(--accent),var(--purple));flex:none}
.user-profile .info{flex:1;min-width:0}
.user-profile .nm{font-weight:700;font-size:13px;font-family:var(--font-head)}
.user-profile .st{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:4px}
.sync-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#8fcfb0}
.sync-dot.off{background:#c2a3ad}
.sync-dot.syncing{background:#f4c06f;animation:pulseDot 1s infinite}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.4}}
.sync-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;background:var(--glass);border:1px solid var(--line);font-size:11px;font-weight:700;color:var(--muted)}
.sync-badge .dot{width:8px;height:8px;border-radius:50%;background:#8fcfb0}
.sync-badge .dot.off{background:#c2a3ad}
.sync-badge .dot.on{background:#8fcfb0;animation:pulseDot 2s infinite}
.wallet{background:linear-gradient(135deg,color-mix(in srgb,var(--purple) 60%,#111),color-mix(in srgb,var(--accent) 40%,#111) 60%,color-mix(in srgb,var(--purple) 50%,#111));color:#fff;border-radius:26px;padding:26px 28px;position:relative;overflow:hidden;box-shadow:0 20px 50px color-mix(in srgb,var(--purple) 40%,transparent)}
.wallet::after{content:'₽';position:absolute;right:-10px;bottom:-40px;font-size:180px;font-family:var(--font-head);font-weight:700;color:#ffffff10;line-height:1}
.wallet > *{position:relative;z-index:1}
.wallet .wallet-label{font-family:var(--font-hand);font-size:18px;opacity:.85}
.wallet .wallet-sum{font-family:var(--font-head);font-size:52px;font-weight:700;line-height:1;margin:6px 0 10px;letter-spacing:-2px}
.wallet .wallet-sum small{font-size:22px;opacity:.7;margin-right:4px}
.wallet .wallet-meta{display:flex;gap:20px;flex-wrap:wrap;font-size:12px;opacity:.85}
.wallet .wallet-meta b{font-size:16px;display:block;font-family:var(--font-head);font-weight:700}
.wallet .wallet-warn{background:#ffffff22;padding:8px 14px;border-radius:12px;margin-top:14px;font-size:12px;display:inline-flex;align-items:center;gap:8px}
.ttt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:280px;margin:16px auto}
.ttt-grid .tile{padding:16px;border-radius:14px;background:var(--card);border:2px solid var(--line);font-size:36px;font-weight:800;text-align:center;cursor:pointer;transition:all .3s cubic-bezier(.2,.9,.3,1.6);font-family:var(--font-head);min-height:70px;display:grid;place-items:center}
.ttt-grid .tile:hover{transform:scale(1.05);border-color:var(--purple);background:color-mix(in srgb,var(--accent) 10%,var(--card))}
.ttt-grid .tile.x{color:var(--ilham);background:color-mix(in srgb,var(--ilham) 15%,var(--card))}
.ttt-grid .tile.o{color:var(--madina);background:color-mix(in srgb,var(--madina) 15%,var(--card))}
.ttt-grid .tile.win{animation:winPulse 1s ease-in-out infinite;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 50%,transparent)}
@keyframes winPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.comp{text-align:center;padding:22px;border-radius:20px;background:var(--grad-side);font-family:var(--font-hand);font-size:22px;color:color-mix(in srgb,var(--purple) 70%,var(--ink));min-height:120px;display:grid;place-items:center;transition:transform .3s}
.comp.flip{animation:cardFlip .6s cubic-bezier(.2,.9,.3,1.4)}
@keyframes cardFlip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
.dice{display:inline-grid;place-items:center;width:96px;height:96px;border-radius:22px;background:linear-gradient(145deg,var(--card),color-mix(in srgb,var(--accent) 20%,var(--card)));box-shadow:0 10px 30px #0002;font-size:52px;font-weight:800;color:var(--purple);font-family:var(--font-head)}
.dice.roll{animation:diceRoll .8s cubic-bezier(.2,.9,.3,1.4)}
@keyframes diceRoll{0%{transform:rotate(0)}25%{transform:rotate(180deg) scale(1.15)}50%{transform:rotate(360deg) scale(.9)}75%{transform:rotate(540deg) scale(1.1)}100%{transform:rotate(720deg)}}
.winner-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:800;margin-left:8px}
.winner-badge.ilham{background:linear-gradient(90deg,#c8dffa,#a8c5f0);color:#2a4a7a}
.winner-badge.madina{background:linear-gradient(90deg,#fad8ec,#f0b8d8);color:#7a2a5a}
.max-btn{background:linear-gradient(135deg,#8b5cf6,#e879c4)!important;color:#fff!important;font-weight:700!important;box-shadow:0 8px 24px #8b5cf644!important}
.max-btn:hover{transform:translateY(-3px) scale(1.03)!important}
.guide-step{display:flex;gap:16px;padding:16px;border-radius:18px;background:var(--glass);margin-bottom:12px;border:1px solid var(--line);transition:transform .35s cubic-bezier(.2,.9,.3,1.6)}
.guide-step:hover{transform:translateX(8px) scale(1.01)}
.guide-num{flex:none;width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--purple));color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px}
.kbd{display:inline-block;padding:3px 9px;border-radius:7px;background:var(--line);font-family:monospace;font-size:12px;border-bottom:2px solid #0002;font-weight:700}
.tip{padding:15px 20px;border-radius:16px;margin:14px 0;background:color-mix(in srgb,var(--accent) 12%,var(--card));border-left:5px solid var(--accent);font-size:13px}
.secret{text-align:center;padding:28px;border-radius:22px;background:var(--grad-side);margin-top:22px;color:color-mix(in srgb,var(--purple) 70%,var(--ink));font-size:20px;line-height:1.7;font-style:italic}
.loader{position:fixed;inset:0;z-index:600;background:var(--bg);display:grid;place-items:center;transition:opacity .4s}
.loader.hide{opacity:0;pointer-events:none}
.loader .spin{width:60px;height:60px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--purple);animation:spin 1s linear infinite}
.loader .txt{margin-top:20px;font-family:var(--font-hand);font-size:20px;color:var(--muted)}
@keyframes spin{to{transform:rotate(360deg)}}
.color-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:14px}

function confetti(){const box=document.createElement('div');box.className='confetti';document.body.appendChild(box);const colors=['#b8a1ed','#e8a3c6','#f4c06f','#8fcfb0','#f0a8c8','#a1c8ed'];for(let i=0;i<80;i++){const c=document.createElement('i');c.style.left=Math.random()*100+'vw';c.style.background=colors[Math.floor(Math.random()*colors.length)];c.style.borderRadius=Math.random()>.5?'50%':'2px';c.style.animationDuration=(1.8+Math.random()*1.5)+'s';c.style.animationDelay=Math.random()*.4+'s';box.appendChild(c)}setTimeout(()=>box.remove(),4200)}

  document.documentElement.classList.toggle('dark',state.theme==='dark');
  document.body.classList.toggle('dark',state.theme==='dark');
  document.documentElement.setAttribute('data-palette',state.palette);

    document.documentElement.style.setProperty('--custom-bg',c.bg);
    document.documentElement.style.setProperty('--custom-card',c.card);
    document.documentElement.style.setProperty('--custom-ink',c.ink);
    document.documentElement.style.setProperty('--custom-accent',c.accent);
    document.documentElement.style.setProperty('--custom-purple',c.purple);
    document.documentElement.style.setProperty('--custom-bg-dark',c.bgDark);
    document.documentElement.style.setProperty('--custom-card-dark',c.cardDark);
    document.documentElement.style.setProperty('--custom-ink-dark',c.inkDark);
    document.documentElement.style.setProperty('--custom-accent-dark',c.accentDark);
    document.documentElement.style.setProperty('--custom-purple-dark',c.purpleDark);
  }
  document.documentElement.style.setProperty('--font-main',`'${state.fontMain}',system-ui,sans-serif`);
  document.documentElement.style.setProperty('--font-head',`'${state.fontHead}',Georgia,serif`);
  document.documentElement.style.setProperty('--font-hand',`'${state.fontHand}',cursive`);
  const el=$('themeIcon');if(el)el.textContent=state.theme==='dark'?'☀':'🌙';
}

/* ============ АВТОРИЗАЦИЯ ============ */
function renderAuth(mode='login',msg='',msgType=''){
  $('authScreen').classList.remove('hidden');
  $('app').classList.add('hidden');
  const isLogin=mode==='login';
  $('authBox').innerHTML=`
    <h1>Мой Ритм</h1>
    <div class="sub-wel">маленькие шаги — большая жизнь ♡</div>
    <div class="auth-tabs">
      <button class="auth-tab ${isLogin?'active':''}" onclick="renderAuth('login')">Войти</button>
      <button class="auth-tab ${!isLogin?'active':''}" onclick="renderAuth('register')">Создать</button>
    </div>
    <div class="auth-form">
      <div><label>Email</label><input type="email" id="authEmail" placeholder="your@email.com" autocomplete="email" value="${esc(localStorage.getItem('mr-last-email')||'')}"></div>
      <div><label>Пароль</label><input type="password" id="authPassword" placeholder="Минимум 6 символов" autocomplete="${isLogin?'current-password':'new-password'}"></div>
      ${!isLogin?`<div><label>Как тебя зовут?</label><input type="text" id="authName" placeholder="Твоё имя"></div><div><label>Эмодзи-аватар</label><input type="text" id="authEmoji" placeholder="💜" maxlength="3" style="text-align:center"></div>`:''}
      ${msg?`<div class="auth-msg ${msgType}">${msg}</div>`:''}
      <button class="primary" id="authBtn" onclick="${isLogin?'handleLogin()':'handleRegister()'}">${isLogin?'Войти':'Создать аккаунт'}</button>
    </div>
    <div class="auth-hint">${isLogin?'💜 Введи email и пароль.':'🌸 Первый раз здесь? Создай аккаунт. Второй партнёр создаст свой — и вы увидите общие разделы.'}</div>`;
  setTimeout(()=>{const el=$('authEmail');if(el)el.focus();const pass=$('authPassword');if(pass)pass.onkeydown=e=>{if(e.key==='Enter')isLogin?handleLogin():handleRegister()}},100);
}
async function handleRegister(){
  const email=$('authEmail').value.trim().toLowerCase();
  const password=$('authPassword').value;
  const name=$('authName').value.trim();
  const emoji=$('authEmoji').value.trim()||'💜';
  if(!email||!password||!name)return renderAuth('register','Заполните все поля','error');
  if(password.length<6)return renderAuth('register','Пароль минимум 6 символов','error');
  const btn=$('authBtn');if(btn){btn.disabled=true;btn.textContent='Подожди…'}
  try{
    const {data,error}=await sb.auth.signUp({email,password});
    if(error)throw error;
    if(!data.user)throw new Error('Не удалось создать пользователя');
    const username=name.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,20)||'user_'+data.user.id.slice(0,6);
    await sb.from('profiles').insert({id:data.user.id,username,display_name:name,emoji,role:''}).then(()=>{}).catch(e=>console.warn('profile',e));
    await sb.from('goals').insert({user_id:data.user.id}).then(()=>{}).catch(e=>console.warn('goals',e));
    localStorage.setItem('mr-last-email',email);
    if(!data.session){const {error:lerr}=await sb.auth.signInWithPassword({email,password});if(lerr)throw lerr}
    toast('💜 Добро пожаловать, '+name+'!');
    await bootAfterLogin();
  }catch(e){
    console.error('REGISTER ERROR:',e);
    const m=e.message?.includes('already')?'Такой email уже зарегистрирован. Попробуй войти.':(e.message||'Ошибка регистрации');
    renderAuth('register',m,'error');
  }finally{const b=$('authBtn');if(b){b.disabled=false;b.textContent='Создать аккаунт'}}
}
async function handleLogin(){
  const email=$('authEmail').value.trim().toLowerCase();
  const password=$('authPassword').value;
  if(!email||!password)return renderAuth('login','Введи email и пароль','error');
  const btn=$('authBtn');if(btn){btn.disabled=true;btn.textContent='Подожди…'}
  try{
    const {error}=await sb.auth.signInWithPassword({email,password});
    if(error)throw error;
    localStorage.setItem('mr-last-email',email);
    await bootAfterLogin();
  }catch(e){
    console.error('LOGIN ERROR:',e);
    let m=e.message||'Ошибка входа';
    if(m.includes('Invalid'))m='Неверный email или пароль';
    if(m.includes('not confirmed'))m='Email не подтверждён.';
    renderAuth('login',m,'error');
  }finally{const b=$('authBtn');if(b){b.disabled=false;b.textContent='Войти'}}
}
async function logout(){
  if(!confirm('Выйти?'))return;
  cleanupRealtime();
  try{await sb.auth.signOut()}catch(e){console.warn(e)}
  Object.assign(state,{user:null,profile:null,partner:null,tasks:[],habits:[],habit_marks:[],foods:[],meals:[],recipes:[],days:[],reminders:[],accounts:[],transactions:[],fin_goals:[],payments:[],wishlist:[],important_dates:[],plans:[],online:false});
  setSyncStatus('off','Офлайн');
  renderAuth('login');
}

/* ============ ЗАГРУЗКА ============ */
async function bootAfterLogin(){
  setSyncStatus('syncing','Загрузка…');
  try{
    const {data:{user},error:uerr}=await sb.auth.getUser();
    if(uerr||!user)throw new Error('Сессия не найдена');
    state.user={id:user.id,email:user.email};
    let {data:prof}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
    if(!prof){
      const nameFromEmail=(user.email||'').split('@')[0];
      await sb.from('profiles').insert({id:user.id,username:nameFromEmail,display_name:nameFromEmail,emoji:'💜',role:''}).then(()=>{}).catch(()=>{});
      const r=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
      prof=r.data;
    }
    state.profile=prof||{display_name:(user.email||'').split('@')[0],emoji:'💜',id:user.id};
    await loadAllData();
    $('authScreen').classList.add('hidden');
    $('app').classList.remove('hidden');
    $('loader').classList.add('hide');
    setSyncStatus('ok','Онлайн');
    render();

/* ============ REALTIME ============ */
let realtimeChannel=null;
function cleanupRealtime(){if(realtimeChannel){try{sb.removeChannel(realtimeChannel)}catch(e){console.warn(e)}realtimeChannel=null}}
function setupRealtime(){
  cleanupRealtime();
  const uid=state.user.id;
  const personalTables=['tasks','habits','habit_marks','foods','meals','recipes','days','reminders','goals'];
  const sharedTables=['accounts','transactions','fin_goals','payments','wishlist','important_dates','plans','game_ttt'];
  const channelName='mr-'+uid+'-'+Date.now();
  const ch=sb.channel(channelName);
  personalTables.forEach(t=>{ch.on('postgres_changes',{event:'*',schema:'public',table:t,filter:`user_id=eq.${uid}`},p=>handleRealtime(t,p))});
  sharedTables.forEach(t=>{ch.on('postgres_changes',{event:'*',schema:'public',table:t},p=>handleRealtime(t,p))});
  realtimeChannel=ch;
  ch.subscribe(s=>{
    if(s==='SUBSCRIBED'){state.online=true;setSyncStatus('ok','Онлайн')}
    if(s==='CHANNEL_ERROR'||s==='TIMED_OUT'){state.online=false;setSyncStatus('off','Офлайн')}
  });
}
function handleRealtime(table,{eventType,new:row,old:oldRow}){
  const arr=state[table];
  if(!Array.isArray(arr))return;
  if(eventType==='INSERT'){if(!arr.find(x=>x.id===row.id))arr.unshift(row)}
  else if(eventType==='UPDATE'){const i=arr.findIndex(x=>x.id===row.id);if(i>=0)arr[i]=row;else arr.unshift(row)}
  else if(eventType==='DELETE'){state[table]=arr.filter(x=>x.id!==oldRow.id)}
  render();
}

function streak(){let s=0,dt=new Date(state.date+'T12:00:00'),first=true;while(s<3650){const k=new Date(dt-dt.getTimezoneOffset()*60000).toISOString().slice(0,10);const any=state.habit_marks.some(m=>m.date===k&&m.done);if(any)s++;else if(!first)break;first=false;dt.setDate(dt.getDate()-1)}return s}

function finTotals(period){
  const now=new Date(state.date+'T12:00:00');
  let from,to;
  if(period==='month'){from=new Date(now.getFullYear(),now.getMonth(),1);to=new Date(now.getFullYear(),now.getMonth()+1,0)}
  else if(period==='week'){from=new Date(now);from.setDate(from.getDate()-6);to=now}
  else{from=new Date(0);to=new Date(86400e12)}
  const fromS=new Date(from-from.getTimezoneOffset()*60000).toISOString().slice(0,10);
  const toS=new Date(to-to.getTimezoneOffset()*60000).toISOString().slice(0,10);
  const list=state.transactions.filter(t=>t.date>=fromS&&t.date<=toS);
  const income=list.filter(t=>t.type==='income').reduce((a,t)=>a+Number(t.amount),0);
  const expense=list.filter(t=>t.type==='expense').reduce((a,t)=>a+Number(t.amount),0);
  return {income,expense,balance:income-expense,count:list.length,list};
}
function finByCategory(period){const t=finTotals(period);const map={};t.list.filter(x=>x.type==='expense').forEach(x=>{map[x.category]=(map[x.category]||0)+Number(x.amount)});return Object.entries(map).sort((a,b)=>b[1]-a[1])}

async function addTransaction(){
  if(!state.user)return;
  const type=$('txType').value,amount=num('txAmount');
  const cat=$('txCat').value,acc=$('txAcc').value,note=$('txNote').value.trim();
  if(!amount||amount<=0)return alert('Укажите сумму');
  if(!acc)return alert('Выберите счёт');
  // ЗАЩИТА ОТ МИНУСА
  if(type==='expense'){
    const a=state.accounts.find(x=>x.id===acc);
    const available=Number(a?.balance||0);
    if(amount>available){
      return alert(`❌ Недостаточно средств на счёте «${a?.name||''}».\n\nДоступно: ${available.toFixed(0)} ₽\nПытаетесь списать: ${amount.toFixed(0)} ₽\n\nОстаток не может быть отрицательным.`);
    }
  }
  const {error}=await sb.from('transactions').insert({date:state.date,type,amount,category:cat,account_id:acc,note,who:state.user.id});
  if(error)return toast('Ошибка: '+error.message);
  let a=state.accounts.find(x=>x.id===acc);
  if(!a){const {data:accData}=await sb.from('accounts').select('*').eq('id',acc).maybeSingle();if(accData){state.accounts.push(accData);a=accData}}
  if(a){const newBal=Number(a.balance||0)+(type==='income'?amount:-amount);await sb.from('accounts').update({balance:newBal}).eq('id',acc);a.balance=newBal}
  const {data:txs}=await sb.from('transactions').select('*').order('date',{ascending:false});
  state.transactions=txs||[];render();
  toast(type==='income'?'💰 +'+amount:'💸 −'+amount);
}

async function deleteAccount(){if(!confirm('Удалить аккаунт? Личные данные будут удалены.'))return;if(!confirm('Точно? Восстановить нельзя.'))return;const uid=state.user.id;await Promise.all([sb.from('tasks').delete().eq('user_id',uid),sb.from('habits').delete().eq('user_id',uid),sb.from('habit_marks').delete().eq('user_id',uid),sb.from('foods').delete().eq('user_id',uid),sb.from('meals').delete().eq('user_id',uid),sb.from('recipes').delete().eq('user_id',uid),sb.from('days').delete().eq('user_id',uid),sb.from('reminders').delete().eq('user_id',uid),sb.from('goals').delete().eq('user_id',uid),sb.from('profiles').delete().eq('id',uid)]);cleanupRealtime();await sb.auth.signOut();localStorage.clear();location.reload()}

async function tttPlay(i){const g=state.game_ttt;if(!g)return;if(g.winner||g.board[i])return;if(g.turn&&g.turn!==state.user.id)return toast('Не твой ход ✋');const b=[...g.board];b[i]=state.user.id;const w=tttWin(b);let winner='';if(w)winner=w;else if(!b.includes(''))winner='draw';const newWins={...(g.wins||{})};if(winner&&winner!=='draw')newWins[winner]=(newWins[winner]||0)+1;const nextTurn=state.partner?state.partner.id:null;await sb.from('game_ttt').update({board:b,winner,wins:newWins,turn:winner?null:nextTurn,updated_at:new Date().toISOString()}).eq('id',g.id);state.game_ttt={...g,board:b,winner,wins:newWins,turn:winner?null:nextTurn};if(winner==='draw')toast('Ничья ✨');else if(winner)confetti();render()}
function tttWin(b){const w=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];for(const [a,c,d] of w){if(b[a]&&b[a]===b[c]&&b[a]===b[d])return b[a]}return null}
async function tttReset(){const g=state.game_ttt;if(!g)return;await sb.from('game_ttt').update({board:["","","","","","","","",""],winner:'',turn:state.user.id,updated_at:new Date().toISOString()}).eq('id',g.id);state.game_ttt={...g,board:["","","","","","","","",""],winner:'',turn:state.user.id};render()}
function diceRoll(){const a=Math.floor(Math.random()*6)+1,b=Math.floor(Math.random()*6)+1;window._diceA=a;window._diceB=b;const el1=$('diceA'),el2=$('diceB');if(el1){el1.textContent=a;el1.classList.add('roll');setTimeout(()=>el1.classList.remove('roll'),800)}if(el2){el2.textContent=b;el2.classList.add('roll');setTimeout(()=>el2.classList.remove('roll'),800)}setTimeout(()=>toast(a===b?'Ничья 🎲':a>b?'🎲 Ты выиграл!':'🎲 '+(state.partner?.display_name||'Партнёр')+' выиграл!'),800)}
let lastComp=-1;
function compliment(){let i;do{i=Math.floor(Math.random()*COMPLIMENTS.length)}while(i===lastComp&&COMPLIMENTS.length>1);lastComp=i;const el=$('compBox');if(el){el.classList.remove('flip');void el.offsetWidth;el.classList.add('flip');setTimeout(()=>{el.textContent=COMPLIMENTS[i]},300)}confetti()}
let quizCurrent=null;

function quizAnswer(){if(!quizCurrent)return;const v=Number($('quizInput').value);if(v===quizCurrent.a){confetti();toast('🎉 Правильно!')}else toast('❌ Ответ: '+quizCurrent.a);quizCurrent=null;render()}
function guessPlay(){if(!state.user)return;const val=Number($('guessInput').value);if(!val||val<1||val>100)return toast('Число от 1 до 100');const key='mr-guess-'+state.user.id;const stored=JSON.parse(localStorage.getItem(key)||'{}');const now=Date.now();if(!stored.secret||(now-stored.start)>5*60*1000){stored.secret=Math.floor(Math.random()*100)+1;stored.start=now;stored.attempts=0}stored.attempts++;localStorage.setItem(key,JSON.stringify(stored));const fb=$('guessFeedback');if(val===stored.secret){if(fb)fb.innerHTML=`<p style="color:var(--success);font-weight:700">🎉 Угадал за ${stored.attempts} попыток! Число: ${stored.secret}</p><button class="small" onclick="localStorage.removeItem('${key}');document.getElementById('guessFeedback').innerHTML='<p class=\\'muted\\'>Начни заново ✨</p>'">🔄 Новая игра</button>`;confetti()}else if(val<stored.secret){if(fb)fb.innerHTML=`<p>📈 Больше! Попытка №${stored.attempts}</p>`}else{if(fb)fb.innerHTML=`<p>📉 Меньше! Попытка №${stored.attempts}</p>`}$('guessInput').value=''}

let notifiedCache={};let notifiedCacheSize=0;
function checkReminders(){if(!state.user)return;const now=new Date(),curDate=todayStr(),curTime=now.toTimeString().slice(0,5);state.reminders.forEach(r=>{if(r.done)return;const k=r.id+'_'+curDate+'_'+curTime;if(notifiedCache[k])return;if(r.recurring==='daily'&&r.time===curTime){notifiedCache[k]=true;notifiedCacheSize++;notifyReminder(r)}else if(r.recurring==='none'&&r.date===curDate&&r.time===curTime){notifiedCache[k]=true;notifiedCacheSize++;notifyReminder(r);sb.from('reminders').update({done:true}).eq('id',r.id).then(()=>{r.done=true})}});if(notifiedCacheSize>500){notifiedCache={};notifiedCacheSize=0}}

/* ============ КОМПОНЕНТЫ ============ */
function card(label,value,sub,color,ratio){return `<div class="card ${color}"><div>${label}</div><b>${value}</b><div class="muted">${sub}</div>${ratio===undefined?'':`<div class="bar"><i style="width:${Math.max(0,Math.min(100,ratio*100))}%"></i></div>`}</div>`}
function empty(t){return `<div class="empty">${t}</div>`}
function glasses(w){const g=state.goals.glass||250;const n=Math.min(16,Math.max(1,Math.ceil((state.goals.water||2000)/g)));return Array.from({length:n},(_,i)=>{const filled=w>=(i+1)*g;return `<button class="glass ${filled?'full':''}" onclick="setday('water',${filled?i*g:(i+1)*g})">💧</button>`}).join('')}
function macrobar(t){const k=[t.p*4,t.f*9,t.c*4],s=k[0]+k[1]+k[2];if(!s)return '';const pc=k.map(x=>Math.round(x/s*100));const col=['#b8a1ed','#f4c06f','#8fcfb0'],nm=['Белки','Жиры','Углеводы'];return `<div class="panel"><h2>Баланс БЖУ дня</h2><div class="macro">${k.map((x,i)=>`<i style="width:${x/s*100}%;background:${col[i]}"></i>`).join('')}</div><div class="legend">${nm.map((n,i)=>`<span><b style="background:${col[i]}"></b>${n} ${pc[i]}% ккал</span>`).join('')}</div></div>`}
function hero(){
  const d=day(),u=state.profile;
  const h=new Date().getHours();
  const g=h<5?'Доброй ночи':h<12?'Доброе утро':h<18?'Добрый день':'Добрый вечер';
  const n=Math.floor(new Date(state.date+'T12:00:00')/864e5);
  const parts=[];
  const tk=tasksForDate(state.date),hb=habitsActive(state.date);
  if(tk.length)parts.push(tk.filter(x=>x.done).length/tk.length);
  if(hb.length)parts.push(hb.filter(h=>markKey(h.id,state.date)).length/hb.length);
  parts.push(Math.min(1,(d.water||0)/(state.goals.water||2000)));
  const p=Math.round(parts.reduce((a,b)=>a+b,0)/parts.length*100);
  const s=streak();
  const fire=s>=7?'🔥🔥':s>=3?'🔥':'✦';
  const q=QUOTES[((n%QUOTES.length)+QUOTES.length)%QUOTES.length];
  return `<div class="hero"><div><span class="for">${u.emoji} ${esc(u.display_name)}</span><h2>${g}!</h2><p>${q[1]}</p><div class="chips"><span>${fire} Серия: ${s}</span><span>${p>=100?'🎉 День закрыт!':'✨ Прогресс: '+p+'%'}</span><span>${tk.filter(x=>!x.done).length} задач</span><span>💰 ${finBalance().toFixed(0)} ₽</span>${state.partner?`<span>💜 ${state.partner.emoji} ${esc(state.partner.display_name)} рядом</span>`:''}</div></div><div class="ring" style="--p:${p}"><span><div>${p}%<small>дня</small></div></span></div></div>`;
}

function render(){
  if(!state.user)return renderAuth('login');
  if(!state.profile)return;
  try{
    const u=state.profile;
    $('userAv').textContent=u.emoji||'💜';
    $('userName').textContent=u.display_name||'Профиль';
    $('dedicText').textContent='для '+(u.display_name||'')+' ♡';
    const titleName=pages[state.page]||extraPages[state.page]||'Мой день';
    $('title').textContent=titleName;
    $('datelabel').textContent=new Date(state.date+'T12:00:00').toLocaleDateString('ru',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

    const dueReminders=state.reminders.filter(r=>!r.done&&((r.recurring==='none'&&r.date===state.date)||r.recurring==='daily')).length;
    const navMain=Object.entries(pages).map(([k,v])=>{
      let badge='';
      if(k==='today'){const c=tasksForDate(state.date).filter(x=>!x.done).length;if(c)badge=`<span class="badge">${c}</span>`}
      return `<button class="${state.page===k?'active':''}" onclick="state.page='${k}';render()"><span class="nav-icon">${icons[k]}</span>${v}${badge}</button>`;
    }).join('');
    const navExtra=Object.entries(extraPages).map(([k,v])=>{
      let badge='';
      if(k==='settings'&&dueReminders)badge=`<span class="badge">${dueReminders}</span>`;
      return `<button class="${state.page===k?'active':''}" onclick="state.page='${k}';render()"><span class="nav-icon">${icons[k]}</span>${v}${badge}</button>`;
    }).join('');
    $('nav').innerHTML=navMain+'<hr>'+navExtra;

    const qi=((Math.floor(new Date(state.date+'T12:00:00')/864e5))%QUOTES.length+QUOTES.length)%QUOTES.length;
    $('sideQuoteTitle').textContent=QUOTES[qi][0];
    $('sideQuote').textContent=QUOTES[qi][1];

    let out='';
    const t=totals(state.date),d=day();
    const tasks=tasksForDate(state.date),active=habitsActive(state.date),done=active.filter(h=>markKey(h.id,state.date)).length;

    /* ===== МОЙ ДЕНЬ ===== */
    if(state.page==='today'){
      const fin=finTotals('month');
      const todayP=state.payments.filter(p=>p.active&&p.next_date<=todayStr()).sort((a,b)=>a.next_date.localeCompare(b.next_date));
      out=hero()+`
      <div class="cards">
        ${card('✦ Привычки',done+' / '+active.length,'Каждый шаг важен','lavender',active.length?done/active.length:0)}
        ${card('◉ Калории',Math.round(t.k),'Цель: '+state.goals.k,'peach',t.k/state.goals.k)}
        ${card('≈ Вода',(d.water||0)+' мл','Цель: '+state.goals.water+' мл','blue',(d.water||0)/state.goals.water)}
        ${card('💰 Баланс',fin.balance.toFixed(0)+' ₽',fin.balance>=0?'В плюсе ✓':'В минусе','mint')}
      </div>
      ${todayP.length?`<div class="panel gold"><h2>📅 Платежи на сегодня</h2>${todayP.map(p=>`<div class="payment-item"><span style="font-size:22px">${p.emoji||'📅'}</span><div class="pinfo"><div class="pname">${esc(p.name)}</div><div class="pmeta">должно было быть ${p.next_date}</div></div><span class="pamount">${p.amount.toFixed(0)} ₽</span><button class="small primary" onclick="markPaymentPaid('${p.id}')">✓ Оплатить</button></div>`).join('')}</div>`:''}
      <div class="grid"><div>
        <div class="panel"><h2>Главное на сегодня</h2>
          <div class="row"><input id="tasktext" placeholder="Добавить задачу…" onkeydown="if(event.key==='Enter')taskadd()"><select id="tasktag" style="flex:0 0 120px">${Object.entries(TAGS).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('')}</select><button class="primary" onclick="taskadd()">+</button></div>

          ${tasks.some(x=>!x.done)?`<div class="row" style="margin-top:14px"><button class="ghost" onclick="carryOver()">→ Перенести на завтра</button></div>`:''}
        </div>

      const daysInMonth=new Date(Number(state.date.slice(0,4)),Number(state.date.slice(5,7)),0).getDate();
      let heat='';

      const habitsDone=state.habit_marks.filter(m=>m.done&&dates.includes(m.date)).length;
      const daysWithNotes=state.days.filter(x=>dates.includes(x.date)&&x.note).length;
      const fin=finTotals(r.days===7?'week':r.days===30?'month':'all');
      const waterTotal=state.days.filter(x=>dates.includes(x.date)).reduce((a,x)=>a+(Number(x.water)||0),0);
      const sleepTotal=state.days.filter(x=>dates.includes(x.date)).reduce((a,x)=>a+(Number(x.sleep)||0),0);
      const sleepAvg=state.days.filter(x=>dates.includes(x.date)&&x.sleep>0).length;
      out=`
      <div class="tabs">
        <button class="tab ${tab==='week'?'active':''}" onclick="state.resultsTab='week';render()">📅 7 дней</button>
        <button class="tab ${tab==='month'?'active':''}" onclick="state.resultsTab='month';render()">📆 30 дней</button>
        <button class="tab ${tab==='all'?'active':''}" onclick="state.resultsTab='all';render()">🗓 Всё время</button>
      </div>
      <div class="cards">
        ${card('☀ Задачи',tasksDone+' / '+tasksTotal,'Выполнено за '+r.label,'lavender',tasksTotal?tasksDone/tasksTotal:0)}
        ${card('✦ Привычки',habitsDone,'Отметок за '+r.label,'mint')}
        ${card('💧 Вода',(waterTotal/1000).toFixed(1)+' л','Всего за '+r.label,'blue')}
        ${card('☾ Сон',sleepAvg?(sleepTotal/sleepAvg).toFixed(1)+' ч':'—','Среднее за '+r.label,'peach')}
      </div>
      <div class="panel" style="margin-top:22px">
        <h2>📊 Калории · ${r.label}</h2>
        <p class="muted">Нажми на столбик, чтобы увидеть детали дня</p>
        <div class="chart">${dates.map((dt,i)=>`<div class="column" onclick="showDayDetail('${dt}')" title="Открыть ${dt}">
          <small>${Math.round(vals[i])}</small>
          <i style="height:${vals[i]/max*110}px;animation-delay:${i*.03}s"></i>
          <small>${dt.slice(5)}</small>
        </div>`).join('')}</div>
      </div>
      <div class="grid-2">
        <div class="panel">
          <h2>💰 Финансы за период</h2>
          <div class="detail-row"><span>Доходы</span><b style="color:var(--success)">+${fin.income.toFixed(0)} ₽</b></div>
          <div class="detail-row"><span>Расходы</span><b style="color:var(--danger)">−${fin.expense.toFixed(0)} ₽</b></div>
          <div class="detail-row"><span>Итого</span><b style="color:${fin.balance>=0?'var(--success)':'var(--danger)'}">${fin.balance>=0?'+':''}${fin.balance.toFixed(0)} ₽</b></div>
          <div class="detail-row"><span>Операций</span><b>${fin.count}</b></div>
        </div>
        <div class="panel">
          <h2>📝 Активность</h2>
          <div class="detail-row"><span>Дней с победами</span><b>${daysWithNotes}</b></div>
          <div class="detail-row"><span>Серия привычек</span><b>🔥 ${streak()} дн.</b></div>
          <div class="detail-row"><span>Записей питания</span><b>${state.meals.filter(m=>dates.includes(m.date)).length}</b></div>
          <div class="detail-row"><span>Среднее ккал/день</span><b>${Math.round(vals.reduce((a,b)=>a+b,0)/r.days)}</b></div>
        </div>
      </div>
      <div class="panel">
        <h2>📖 Детализация по дням</h2>
        <div class="tablewrap"><table>
          <thead><tr><th>Дата</th><th>Ккал</th><th>Вода</th><th>Сон</th><th>Задачи</th><th>Привычки</th><th>Настроение</th><th></th></tr></thead>
          <tbody>${dates.slice().reverse().map(dt=>{
            const tt=totals(dt);
            const dd=dayAt(dt);
            const ts=state.tasks.filter(x=>x.date===dt);
            const td=ts.filter(x=>x.done).length;
            const hs=state.habit_marks.filter(m=>m.date===dt&&m.done).length;
            return `<tr style="cursor:pointer" onclick="showDayDetail('${dt}')">
              <td><b>${dt}</b></td>
              <td>${Math.round(tt.k)}</td>
              <td>${dd.water||0} мл</td>
              <td>${dd.sleep||0} ч</td>
              <td>${td}/${ts.length}</td>
              <td>${hs}</td>
              <td>${esc(dd.mood||'—')}</td>
              <td><button class="small ghost">→</button></td>
            </tr>`;
          }).join('')}</tbody>
        </table></div>
      </div>`;
    }

    /* ===== ПРОФИЛЬ ===== */
    if(state.page==='profile'){
      const p=state.profile;
      out=`<div class="panel" style="background:var(--grad-hero)"><h2>${p.emoji} ${esc(p.display_name)}</h2><p class="muted">Email: <b>${esc(state.user.email)}</b></p></div>
      <div class="grid-2"><div class="panel"><h2>Мой профиль</h2><div class="row"><label style="flex:1">Имя <input id="profName" value="${esc(p.display_name)}"></label><label style="flex:0 0 100px">Эмодзи <input id="profEmoji" value="${esc(p.emoji)}" maxlength="3" style="text-align:center"></label></div><div class="row" style="margin-top:10px"><label style="flex:1">О себе <input id="profRole" value="${esc(p.role||'')}"></label></div><div class="row" style="margin-top:14px"><button class="primary" onclick="saveProfile()">Сохранить</button><button onclick="changePassword()">Сменить пароль</button></div></div>
      <div class="panel"><h2>Статус</h2><p class="muted">${state.online?'🟢 Онлайн':'🟠 Офлайн'}</p><div class="row" style="margin-top:14px"><button onclick="reloadAll()">↻ Перезагрузить</button></div>${state.partner?`<h2 style="margin-top:22px">Партнёр</h2><div class="item"><span style="font-size:24px">${state.partner.emoji}</span><span><b>${esc(state.partner.display_name)}</b></span></div>`:'<p class="muted" style="margin-top:14px">Партнёр пока не зарегистрирован 💜</p>'}</div></div>
      <div class="panel"><h2>Данные</h2><div class="row"><button class="primary" onclick="backup()">↓ Сохранить JSON-копию</button><button onclick="$('restore').click()">↥ Восстановить</button><button onclick="csv()">▤ Питание → CSV</button><button onclick="logout()">🚪 Выйти</button><input class="hidden" type="file" id="restore" accept=".json" onchange="restore(this.files[0])"></div></div>`;
    }

    /* ===== НАСТРОЙКИ ===== */
    if(state.page==='settings'){
      const palettes=[
        {id:'lavender',c1:'#e9dbfb',c2:'#b8a1ed',name:'Лаванда'},
        {id:'peach',c1:'#ffe4cf',c2:'#f4c06f',name:'Персик'},
        {id:'mint',c1:'#d5ebd9',c2:'#8fcfb0',name:'Мята'},
        {id:'sky',c1:'#d6e8f7',c2:'#7ba7e8',name:'Небо'},
        {id:'rose',c1:'#fce4ee',c2:'#e88fc4',name:'Роза'},
        {id:'sunset',c1:'#ffd8c8',c2:'#ff8a65',name:'Закат'},
        {id:'forest',c1:'#d8ebd0',c2:'#7db67d',name:'Лес'},
        {id:'ocean',c1:'#c8e0f0',c2:'#5fb8d0',name:'Океан'},
        {id:'gold',c1:'#ffe8b8',c2:'#e8c46f',name:'Золото'},
        {id:'coral',c1:'#ffd8d8',c2:'#ff9a9a',name:'Коралл'},
        {id:'custom',c1:state.custom.accent,c2:state.custom.purple,name:'Своя 🎨'}
      ];
      const fontsMain=['Comfortaa','Montserrat','Inter','Rubik'];
      const fontsHead=['Cormorant Garamond','Playfair Display','Lora','Georgia'];
      const fontsHand=['Caveat','Pacifico','Marck Script'];
      const c=state.custom;
      const todayR=state.reminders.filter(r=>!r.done&&((r.recurring==='none'&&r.date===state.date)||r.recurring==='daily'));
      const maxUser=localStorage.getItem('mr-max-user-'+state.user.id)||'';
      const maxPhone=localStorage.getItem('mr-max-phone-'+state.user.id)||'';
      out=`<div class="panel lavender"><h2>Настройки ⚙</h2></div>
      <div class="panel"><h2>🎨 Палитра темы</h2><div class="color-grid">${palettes.map(p=>`<div class="color-swatch ${state.palette===p.id?'active':''}" style="background:linear-gradient(135deg,${p.c1},${p.c2})" title="${p.name}" onclick="setPalette('${p.id}')">${p.name}</div>`).join('')}</div></div>
      <div class="panel"><h2>🎨 Своя тема</h2>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
          <div><h4 style="margin:0 0 10px;font-size:14px">☀ Светлая</h4>
            <div class="picker-row"><label>Фон</label><input type="color" value="${c.bg}" onchange="setCustomColor('bg',this.value)"></div>
            <div class="picker-row"><label>Карточки</label><input type="color" value="${c.card}" onchange="setCustomColor('card',this.value)"></div>
            <div class="picker-row"><label>Текст</label><input type="color" value="${c.ink}" onchange="setCustomColor('ink',this.value)"></div>
            <div class="picker-row"><label>Акцент</label><input type="color" value="${c.accent}" onchange="setCustomColor('accent',this.value)"></div>
            <div class="picker-row"><label>Кнопки</label><input type="color" value="${c.purple}" onchange="setCustomColor('purple',this.value)"></div>
          </div>
          <div><h4 style="margin:0 0 10px;font-size:14px">🌙 Тёмная</h4>
            <div class="picker-row"><label>Фон</label><input type="color" value="${c.bgDark}" onchange="setCustomColor('bgDark',this.value)"></div>
            <div class="picker-row"><label>Карточки</label><input type="color" value="${c.cardDark}" onchange="setCustomColor('cardDark',this.value)"></div>
            <div class="picker-row"><label>Текст</label><input type="color" value="${c.inkDark}" onchange="setCustomColor('inkDark',this.value)"></div>
            <div class="picker-row"><label>Акцент</label><input type="color" value="${c.accentDark}" onchange="setCustomColor('accentDark',this.value)"></div>
            <div class="picker-row"><label>Кнопки</label><input type="color" value="${c.purpleDark}" onchange="setCustomColor('purpleDark',this.value)"></div>
          </div>
        </div>
        <div class="row" style="margin-top:14px"><button class="primary" onclick="setPalette('custom')">Применить свою тему</button><button onclick="resetCustom()">🔄 Сбросить</button></div>
      </div>
      <div class="panel"><h2>✍ Основной шрифт</h2>${fontsMain.map(f=>`<div class="font-preview ${state.fontMain===f?'active':''}" onclick="setFont('Main','${f}')" style="font-family:'${f}',sans-serif"><div class="fp-name">${f}</div><div class="fp-sample" style="font-family:'${f}',sans-serif">Маленькие шаги, большая жизнь</div></div>`).join('')}</div>
      <div class="panel"><h2>📖 Заголовки</h2>${fontsHead.map(f=>`<div class="font-preview ${state.fontHead===f?'active':''}" onclick="setFont('Head','${f}')" style="font-family:'${f}',serif"><div class="fp-name">${f}</div><div class="fp-sample" style="font-family:'${f}',serif">Мой Ритм</div></div>`).join('')}</div>
      <div class="panel"><h2>🖋 Рукописный</h2>${fontsHand.map(f=>`<div class="font-preview ${state.fontHand===f?'active':''}" onclick="setFont('Hand','${f}')" style="font-family:'${f}',cursive"><div class="fp-name">${f}</div><div class="fp-sample" style="font-family:'${f}',cursive">Ты — моё чудо ♡</div></div>`).join('')}</div>
      <div class="panel"><h2>🎯 Цели питания и воды</h2><div class="formgrid">${Object.entries({k:'Калории, ккал',p:'Белки, г',f:'Жиры, г',c:'Углеводы, г',water:'Вода, мл',glass:'Стакан, мл'}).map(([k,l])=>`<label>${l}<input type="number" min="1" value="${state.goals[k]}" onchange="saveGoal('${k}',Math.max(1,Number(this.value)||1))"></label>`).join('')}</div></div>
      <div class="panel"><h2>🔔 Напоминания и MAX</h2>
        <div class="row"><input id="remText" placeholder="О чём напомнить?"><input id="remTime" type="time" style="flex:0 0 130px"><input id="remDate" type="date" style="flex:0 0 150px" value="${state.date}"><select id="remRec" style="flex:0 0 130px"><option value="none">Один раз</option><option value="daily">Каждый день</option></select><button class="primary" onclick="addReminder()">+</button></div>
        ${todayR.length?`<h3 style="margin-top:18px">Сегодня</h3>${todayR.map(r=>`<div class="item"><span style="font-size:20px">🔔</span><span><b>${esc(r.text)}</b><br><small class="muted">${r.time} · ${r.recurring==='daily'?'ежедневно':r.date}</small></span><button class="delete" onclick="delReminder('${r.id}')">×</button></div>`).join('')}`:''}
        <h3 style="margin-top:18px">MAX мессенджер</h3>
        <div class="row"><input id="maxUsername" placeholder="@username" value="${esc(maxUser)}" onchange="localStorage.setItem('mr-max-user-${state.user.id}',this.value);toast('💜 Сохранено')"><input id="maxPhone" placeholder="+7..." value="${esc(maxPhone)}" onchange="localStorage.setItem('mr-max-phone-${state.user.id}',this.value);toast('💜 Сохранено')"></div>
        <div class="row" style="margin-top:10px"><button class="max-btn" onclick="sendDailySummary()">💬 Отправить сводку</button><button class="max-btn" onclick="sendLove()">💜 Отправить любовь</button><button onclick="requestNotifPerm()">🔔 Уведомления браузера</button></div>
      </div>
      <div class="panel"><h2>🎉 Настроение</h2><div class="row"><button onclick="toggleTheme()">${state.theme==='dark'?'☀ Светлая тема':'🌙 Тёмная тема'}</button><button onclick="confetti()">🎉 Конфетти</button><button onclick="heartRain()">💜 Дождь из сердечек</button></div></div>
      <div class="panel" style="background:linear-gradient(145deg,#ffe0e0,#ffd0d0)"><h2>Опасная зона</h2><button class="danger" onclick="deleteAccount()">Удалить мой аккаунт</button></div>`;
    }

    $('view').innerHTML=out;
    if(state.page==='finance')refreshTxCategories();
  }catch(e){
    console.error('RENDER ERROR:',e);
    $('view').innerHTML=`<div class="panel" style="background:#ffe0e0;color:#a23a3a"><h2>Ошибка отрисовки</h2><p>${esc(e.message)}</p></div>`;
  }
}

function refreshTxCategories(){
  const type=window._txType||'expense';
  const sel=$('txCat');if(!sel)return;
  const cats=type==='income'?['Зарплата','Подарок','Подработка','Возврат','Другое']:['Продукты','Кафе','Транспорт','Дом','Здоровье','Красота','Развлечения','Одежда','Подарки','Учёба','Связь','Животные','Платежи','Другое'];
  sel.innerHTML=cats.map(c=>`<option>${c}</option>`).join('');
}

/* ============ ДЕТАЛИЗАЦИЯ ДНЯ ============ */
function showDayDetail(dt){
  const dd=dayAt(dt);
  const tt=totals(dt);
  const ts=state.tasks.filter(x=>x.date===dt);
  const ms=state.meals.filter(m=>m.date===dt);
  const hs=state.habits.map(h=>({h, done:markKey(h.id,dt)})).filter(x=>x.done);
  const txs=state.transactions.filter(t=>t.date===dt);
  const html=`
    <h2 class="modal-title">📅 ${new Date(dt+'T12:00:00').toLocaleDateString('ru',{weekday:'long',day:'numeric',month:'long'})}</h2>

    <h3>☀ Задачи · ${ts.filter(x=>x.done).length}/${ts.length}</h3>
    ${ts.length?ts.map(x=>`<div class="detail-row"><span>${x.done?'✅':'⬜'} ${esc(x.text)}</span></div>`).join(''):'<p class="muted">Нет задач</p>'}

    <h3 style="margin-top:20px">✦ Привычки · ${hs.length}</h3>
    ${hs.length?hs.map(x=>`<div class="detail-row"><span>${x.h.emoji||'✦'} ${esc(x.h.name)}</span></div>`).join(''):'<p class="muted">Нет отмеченных привычек</p>'}

    <h3 style="margin-top:20px">◉ Питание</h3>
    ${ms.length?ms.map(m=>`<div class="detail-row"><span>${esc(m.type)} · ${esc(m.name)} ${m.grams}г</span><b>${Number(m.k).toFixed(0)} ккал</b></div>`).join(''):'<p class="muted">Нет записей питания</p>'}
    ${ms.length?`<div class="detail-row" style="border-top:2px solid var(--line);margin-top:8px;padding-top:10px"><span>Итого</span><b>${tt.k.toFixed(0)} ккал · Б${tt.p.toFixed(0)} Ж${tt.f.toFixed(0)} У${tt.c.toFixed(0)}</b></div>`:''}

    <h3 style="margin-top:20px">💧 Вода · ${dd.water||0} мл</h3>
    <h3>☾ Сон · ${dd.sleep||0} ч</h3>
    <h3>😊 Настроение</h3>
    <p>${esc(dd.mood||'—')}</p>
    ${dd.note?`<h3 style="margin-top:20px">♡ Победа дня</h3><p style="font-style:italic">${esc(dd.note)}</p>`:''}

    ${txs.length?`<h3 style="margin-top:20px">💰 Операции</h3>${txs.map(t=>`<div class="detail-row"><span>${t.type==='income'?'+':'−'} ${esc(t.category)}</span><b>${Number(t.amount).toFixed(0)} ₽</b></div>`).join('')}`:''}
  `;
  openModal(html);
}

/* ============ ИНИЦИАЛИЗАЦИЯ ============ */
async function init(){
  console.log('🚀 Мой Ритм v8.0');
  applyTheme();
  spawnHearts();
  spawnStars();
  const dateInput=$('date');
  if(dateInput){dateInput.value=state.date;dateInput.onchange=e=>{if(e.target.value){state.date=e.target.value;render()}}}
  try{
    const {data:{session},error}=await sb.auth.getSession();
    if(session)await bootAfterLogin();
    else{$('loader').classList.add('hide');renderAuth('login')}
  }catch(e){console.error('INIT ERROR:',e);$('loader').classList.add('hide');renderAuth('login','Ошибка: '+e.message,'error')}
  setTimeout(()=>$('loader').classList.add('hide'),1200);
  sb.auth.onAuthStateChange((event,sess)=>{
    if(event==='SIGNED_OUT'){cleanupRealtime();state.user=null;renderAuth('login')}
  });
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
window.addEventListener('error',e=>console.error('Global error:',e.error));
window.addEventListener('unhandledrejection',e=>console.error('Unhandled:',e.reason));
</script>
</body>
</html>
