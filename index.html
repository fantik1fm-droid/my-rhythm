<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8970c9">
<meta name="description" content="Мой Ритм — наш общий ритм: забота о себе, друг о друге и о доме.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Мой Ритм">
<title>Мой Ритм</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="loader" id="loader"><div class="loader-in"><div class="logo-heart">♡</div><div>Мой Ритм</div></div></div>

<div id="auth" class="hidden"></div>

<div id="app" class="hidden">
  <aside id="side">
    <div class="brand">мой <span>♡</span> ритм</div>
    <div class="side-sub">наш общий ритм</div>
    <nav id="nav"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <main>
    <header id="top">
      <div class="top-l">
        <div class="muted small" id="topDate"></div>
        <h1 id="topTitle"></h1>
      </div>
      <div class="top-r">
        <span class="net" id="net" title="Связь"></span>
        <button class="icon-btn" data-act="openSearch" title="Поиск">⌕</button>
        <button class="icon-btn" data-act="go" data-page="settings" title="Настройки">⚙</button>
      </div>
    </header>
    <div id="view"></div>
  </main>
  <nav id="tabbar"></nav>
  <button id="fab" data-act="quickAdd" aria-label="Быстро добавить">+</button>
</div>

<div class="sheet-back" id="sheetBack" data-act="closeSheet"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
